name: Build and Test ATS3

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Also build the bootstrap libraries
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-linux:
    name: Ubuntu build and prelude tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: bash travis-ci/install-deps.sh

      - name: Build bundled ATS2
        run: bash travis-ci/install-ats2.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build and test ATS-Xanadu
        run: bash travis-ci/run.sh

      - name: Build bootstrap libraries
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
        run: bash travis-ci/bootstrap.sh
