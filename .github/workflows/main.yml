name: Ubuntu CI

on:
  schedule:
    - cron: '0 2 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      jobs:
        description: Which build jobs to run
        type: choice
        options:
          - build-with-prelude-tests
          - build-with-bootstrap-tests
        default: build-with-prelude-tests
      bootstrap:
        description: Also build the bootstrap libraries (applies when build-with-prelude-tests is selected)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    name: Check whether this commit needs a build
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      build: ${{ steps.check.outputs.build }}
      bootstrap: ${{ steps.check.outputs.bootstrap }}
      boottest: ${{ steps.check.outputs.boottest }}
    steps:
      - name: Check previous successful runs
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_BOOTSTRAP: ${{ inputs.bootstrap == true }}
          MANUAL_JOBS: ${{ inputs.jobs }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            case "$MANUAL_JOBS" in
              'build-with-prelude-tests')
                echo 'build=true' >> "$GITHUB_OUTPUT"
                echo "bootstrap=$MANUAL_BOOTSTRAP" >> "$GITHUB_OUTPUT"
                echo 'boottest=false' >> "$GITHUB_OUTPUT"
                ;;
              'build-with-bootstrap-tests')
                echo 'build=false' >> "$GITHUB_OUTPUT"
                echo 'bootstrap=false' >> "$GITHUB_OUTPUT"
                echo 'boottest=true' >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Unknown manual job selection: $MANUAL_JOBS" >&2
                exit 1
                ;;
            esac
            exit 0
          fi

          if [[ "$(TZ=America/New_York date +%u)" == 1 ]]; then
            echo 'boottest=true' >> "$GITHUB_OUTPUT"
          else
            echo 'boottest=false' >> "$GITHUB_OUTPUT"
          fi

          # Alternate local calendar dates, including across month boundaries.
          # Count dates in UTC so daylight saving changes do not affect parity.
          local_date=$(TZ=America/New_York date +%F)
          calendar_day=$(( $(date -u -d "$local_date" +%s) / 86400 ))
          if (( calendar_day % 2 == 0 )); then
            echo 'bootstrap=true' >> "$GITHUB_OUTPUT"
          else
            echo 'bootstrap=false' >> "$GITHUB_OUTPUT"
          fi

          # Match the exact commit, so changes are not lost after a missed run.
          # Failed builds are retried; manual runs always bypass this check.
          successful_runs=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/main.yml/runs" \
            -f branch="$GITHUB_REF_NAME" \
            -f head_sha="$GITHUB_SHA" \
            -f status=success \
            -f per_page=100 \
            --jq '[.workflow_runs[] | select(.event != "pull_request")] | length')
          if [[ "$successful_runs" -gt 0 ]]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo 'This commit has already passed CI; skipping the build.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

  build-and-test-linux:
    needs: check-changes
    if: needs.check-changes.outputs.build == 'true'
    name: Ubuntu build and prelude tests
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: bash travis-ci/install-deps.sh

      - name: Build bundled ATS2
        run: bash travis-ci/install-ats2.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build and test ATS-Xanadu
        run: bash travis-ci/run.sh

      - name: Build bootstrap libraries
        if: needs.check-changes.outputs.bootstrap == 'true'
        run: bash travis-ci/bootstrap.sh

  bootstrap-with-test-linux:
    needs: check-changes
    if: needs.check-changes.outputs.boottest == 'true'
    name: Ubuntu build with bootstrap tests
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: bash travis-ci/install-deps.sh

      - name: Build bundled ATS2
        run: bash travis-ci/install-ats2.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build prerequisites, bootstrap libraries, and run bootstrap tests
        run: |
          source travis-ci/common.sh
          setup_ats2
          require node scheme python3
          # Jobs use separate runners, so rebuild the generated inputs from J1.
          export npm_config_yes=true
          overall all
          overall bootall
          overall boottest
